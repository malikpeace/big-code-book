<div class="bcb-i" id="sql-playground"></div>
<script>
(() => {
  const root = document.querySelector("#sql-playground");
  const CDN = "https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/";
  const queries = [
    ["All tasks", "SELECT id, owner_id, title, done FROM tasks ORDER BY id;"],
    ["Malik's open tasks", "SELECT title FROM tasks WHERE owner_id = 1 AND done = 0;"],
    ["Count check-ins", "SELECT user_id, COUNT(*) AS days FROM checkins GROUP BY user_id;"],
    ["Join names to tasks", "SELECT users.name, tasks.title FROM tasks JOIN users ON users.id = tasks.owner_id;"],
    ["Latest notes", "SELECT body, created_at FROM notes ORDER BY created_at DESC LIMIT 2;"],
    ["Task plus check-ins", "SELECT tasks.title, COUNT(checkins.id) AS checkins FROM tasks LEFT JOIN checkins ON checkins.task_id = tasks.id GROUP BY tasks.id;"],
  ];
  let db;
  root.innerHTML = `<h3>SQL playground</h3><p class="i-dim">Four tiny tables, six guided queries. SQL runs locally in your browser.</p><div class="i-row"><button type="button" data-start>Load database</button><span data-state aria-live="polite">Not loaded</span></div><div class="i-row" data-guides></div><label><span>Query</span><textarea data-query>${queries[0][1]}</textarea></label><p><button type="button" data-run disabled>Run query</button></p><div data-result class="i-panel"></div><div class="i-panel i-live"><b>POLICY SIMULATOR</b><p>This JavaScript filter demonstrates the result a Postgres RLS owner rule would produce. sql.js cannot run or enforce Postgres RLS.</p><div class="i-row"><button type="button" data-user="1">Act as Malik</button><button type="button" data-user="2">Act as Ada</button></div><pre data-policy>Load the database first.</pre><p class="i-dim">Recorded real Postgres shape: authenticated user 1 sees owner_id 1 rows; user 2 sees owner_id 2 rows; no session sees zero rows.</p></div>`;
  const guides = root.querySelector("[data-guides]");
  queries.forEach(([name, sql]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = name;
    button.addEventListener("click", () => { root.querySelector("[data-query]").value = sql; run(); });
    guides.append(button);
  });
  function loadScript() {
    return new Promise((resolve, reject) => {
      if (window.initSqlJs) return resolve();
      const script = document.createElement("script");
      script.src = CDN + "sql-wasm.js";
      script.onload = resolve;
      script.onerror = () => reject(new Error("Could not load sql.js"));
      document.head.append(script);
    });
  }
  async function start() {
    const state = root.querySelector("[data-state]");
    state.textContent = "Loading...";
    try {
      await loadScript();
      const SQL = await window.initSqlJs({ locateFile: file => CDN + file });
      db = new SQL.Database();
      db.run(`CREATE TABLE users(id INTEGER PRIMARY KEY, name TEXT); CREATE TABLE tasks(id INTEGER PRIMARY KEY, owner_id INTEGER, title TEXT, done INTEGER); CREATE TABLE checkins(id INTEGER PRIMARY KEY, user_id INTEGER, task_id INTEGER, day TEXT); CREATE TABLE notes(id INTEGER PRIMARY KEY, user_id INTEGER, body TEXT, created_at TEXT); INSERT INTO users VALUES (1,'Malik'),(2,'Ada'); INSERT INTO tasks VALUES (1,1,'Read my own code',0),(2,1,'Ship the lab',1),(3,2,'Test the boundary',0); INSERT INTO checkins VALUES (1,1,1,'2026-09-19'),(2,1,1,'2026-09-20'),(3,2,3,'2026-09-20'); INSERT INTO notes VALUES (1,1,'One small move','2026-09-19'),(2,2,'Found the edge','2026-09-20');`);
      state.textContent = "Ready: users, tasks, checkins, notes";
      root.querySelector("[data-run]").disabled = false;
      run();
    } catch (error) { state.textContent = error.message; }
  }
  function run() {
    if (!db) return;
    const out = root.querySelector("[data-result]");
    try {
      const sets = db.exec(root.querySelector("[data-query]").value);
      if (!sets.length) { out.textContent = "Query ran. No rows returned."; return; }
      const { columns, values } = sets[0];
      const table = document.createElement("table");
      const head = table.createTHead().insertRow();
      columns.forEach(column => { const th = document.createElement("th"); th.textContent = column; head.append(th); });
      table.createTBody();
      values.forEach(row => { const tr = document.createElement("tr"); row.forEach(value => { const td = document.createElement("td"); td.textContent = value; tr.append(td); }); table.tBodies[0].append(tr); });
      out.replaceChildren(table);
    } catch (error) { out.textContent = error.message; }
  }
  function simulate(userId) {
    if (!db) return;
    const result = db.exec(`SELECT id, owner_id, title FROM tasks WHERE owner_id = ${Number(userId)};`)[0];
    root.querySelector("[data-policy]").textContent = JSON.stringify(result ? result.values : [], null, 2);
  }
  root.querySelector("[data-start]").addEventListener("click", start);
  root.querySelector("[data-run]").addEventListener("click", run);
  root.querySelectorAll("[data-user]").forEach(button => button.addEventListener("click", () => simulate(button.dataset.user)));
})();
</script>
